privilegeTargets:
  'Neos\Flow\Security\Authorization\Privilege\Method\MethodPrivilege':
    # The source definitions and icon endpoints are backend-only: any
    # logged-in editor may query them, matching the classic Neos UI data source.
    'Beromir.NeosStudio.IconSelectEditor:Icons':
      matcher: 'method(Beromir\NeosStudio\IconSelectEditor\Controller\IconsController->(sources|index|icon)Action())'

roles:
  'Neos.Neos:AbstractEditor':
    privileges:
      -
        privilegeTarget: 'Beromir.NeosStudio.IconSelectEditor:Icons'
        permission: GRANT
