Medienreaktor:
  NeosStudio:
    # Register this package's bundle with the Studio shell. The
    # StudioController reads this map and injects the assets into the served
    # SPA. Build the bundle with
    #   cd Resources/Private/Plugin && npm install && npm run build
    # which emits the referenced files into Resources/Public/Plugin.
    plugins:
      'Beromir.NeosStudio.IconSelectEditor':
        javascript: 'resource://Beromir.NeosStudio.IconSelectEditor/Public/Plugin/plugin.js'
        stylesheet: 'resource://Beromir.NeosStudio.IconSelectEditor/Public/Plugin/plugin.css'
        position: 110

Neos:
  Flow:
    mvc:
      routes:
        # The icon listing endpoint (see Routes.yaml) must match before the
        # Neos backend catch-all routes.
        'Beromir.NeosStudio.IconSelectEditor':
          position: 'before Neos.Neos'

    security:
      authentication:
        providers:
          # Authenticate the icon listing through Studio's OAuth API client,
          # alongside the shell's own and Neos API controllers.
          'Medienreaktor.NeosApi:Bearer':
            requestPatterns:
              'Beromir.NeosStudio.IconSelectEditor:Controllers':
                pattern: 'ControllerObjectName'
                patternOptions:
                  controllerObjectNamePattern: 'Beromir\NeosStudio\IconSelectEditor\Controller\.*'
